<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भारतीय राज्यघटना - अभ्यासक्रम</title>

    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --bg: #ffffff;
            --nav-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            overflow: hidden; /* मुख्य पेजचा अनावश्यक स्क्रोल टाळण्यासाठी */
        }

        /* वरचा हेडर विभाग */
        header {
            background: var(--primary);
            color: white;
            padding: 12px 15px;
            text-align: center;
            height: 65px;
            box-sizing: border-box;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        header h2 { margin: 0; font-size: 1.1rem; letter-spacing: 0.5px; }
        header p { margin: 3px 0 0; color: #f39c12; font-size: 0.85rem; font-weight: bold; }

        /* Iframe क्षेत्र */
        .main-container {
            width: 100%;
            height: calc(100vh - 135px); /* हेडर आणि नेव्ह बार वजा करून उरलेली जागा */
            background: #f8f9fa;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        iframe.active {
            display: block;
        }

        /* वेलकम मेसेज (सुरुवातीला दिसण्यासाठी) */
        #welcome-screen {
            position: absolute;
            top: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: #fdfdfd; color: #95a5a6;
        }

        /* खालचा नेव्हीगेशन बार */
        .mobile-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: var(--nav-bg);
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.1);
            z-index: 1000;
            scrollbar-width: none;
        }
        .mobile-nav::-webkit-scrollbar { display: none; }

        .nav-item {
            padding: 0 20px;
            height: 100%;
            border: none;
            background: none;
            font-size: 12.5px;
            font-weight: 700;
            color: #7f8c8d;
            flex-shrink: 0;
            cursor: pointer;
            border-top: 4px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: var(--accent);
            border-top: 4px solid var(--accent);
            background: #fff9f4;
        }
    </style>
</head>
<body>

    <header>
        <h2 id="header-title">भारतीय राज्यघटना</h2>
        <p id="header-subtitle">अभ्यासासाठी प्रकरण निवडा</p>
    </header>

    <div class="main-container">
        <!-- सुरुवातीची स्क्रीन -->
        <div id="welcome-screen">
            <img src="https://img.icons8.com/color/96/law.png" alt="logo" style="opacity: 0.5;">
            <p style="margin-top: 15px;">खालील मेनूमधून प्रकरणावर क्लिक करा.</p>
        </div>

        <!-- Iframes (तुमच्या १.html ते ७.html फाईल्स लोडिंगसाठी) -->
        <iframe id="p1" src="1.html"></iframe>
        <iframe id="p2" src="2.html"></iframe>
        <iframe id="p3" src="3.html"></iframe>
        <iframe id="p4" src="4.html"></iframe>
        <iframe id="p5" src="5.html"></iframe>
        <iframe id="p6" src="6.html"></iframe>
        <iframe id="p7" src="7.html"></iframe>
    </div>

    <!-- बॉटम नेव्हीगेशन -->
    <nav class="mobile-nav">
        <button class="nav-item" onclick="openChapter(this, 'p1', 'राज्यघटनेची निर्मिती', 'ऐतिहासिक पार्श्वभूमी')">निर्मिती</button>
        <button class="nav-item" onclick="openChapter(this, 'p2', 'घटना समितीची रचना', 'सदस्य आणि निवड')">रचना</button>
        <button class="nav-item" onclick="openChapter(this, 'p3', 'घटना समितीचे कार्य', 'कामकाज आणि प्रक्रिया')">कार्य</button>
        <button class="nav-item" onclick="openChapter(this, 'p4', 'घटना समिती', 'प्रमुख वैशिष्ठ्ये')">घटना समिती</button>
        <button class="nav-item" onclick="openChapter(this, 'p5', 'घटना समितीच्या समित्या', 'मसुदा आणि इतर समित्या')">समित्या</button>
        <button class="nav-item" onclick="openChapter(this, 'p6', 'संविधानाची अंमलबजावणीपूर्व प्रक्रिया', 'वाचने आणि दुरुस्त्या')">अंमलबजावणीपूर्व</button>
        <button class="nav-item" onclick="openChapter(this, 'p7', 'संविधान अंमलबजावणी + टीका + तथ्ये', 'अंतिम टप्पा व मूल्यमापन')">अंमलबजावणी</button>
    </nav>

    <script>
        function openChapter(btn, iframeId, title, subtitle) {
            // १. वेलकम मेसेज लपवा
            document.getElementById('welcome-screen').style.display = 'none';

            // २. सर्व Iframes लपवा
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));

            // ३. सर्व बटणांचा Active क्लास काढा
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

            // ४. निवडलेला Iframe आणि बटण Active करा
            document.getElementById(iframeId).classList.add('active');
            btn.classList.add('active');

            // ५. हेडर अपडेट करा
            document.getElementById('header-title').innerText = title;
            document.getElementById('header-subtitle').innerText = subtitle;

            // ६. मोबाईलवर नेव्हीगेशन बारमधील बटण मध्यभागी स्क्रोल करा
            btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
    </script>

</body>
</html>
