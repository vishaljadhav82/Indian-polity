<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ऐतिहासिक पार्श्वभूमी (१६०० ते १७५७)</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            border-bottom: 3px solid #2c3e50;
            display: inline-block;
            padding-bottom: 10px;
        }
        .nav-container {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            transition: 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.active {
            background-color: #2c3e50;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        .iframe-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            height: 80vh;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            overflow: hidden;
            display: none; /* सुरुवातीला सर्व लपवलेले */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #welcome-msg {
            margin-top: 50px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <h1>ऐतिहासिक पार्श्वभूमी (१६०० ते १७५७)</h1>

    <div class="nav-container">
        <button onclick="showPage('page1', this)">भारतात युरोपियनांचे आगमन</button>
        <button onclick="showPage('page2', this)">१७७३ चा रेग्युलेटिंग ॲक्ट</button>
        <button onclick="showPage('page3', this)">पिट्स इंडिया ॲक्ट, १७८४</button>
        <button onclick="showPage('page4', this)">चार्टर ॲक्ट १८३३</button>
        <button onclick="showPage('page5', this)">चार्टर ॲक्ट १८५३</button>
    </div>

    <div id="welcome-msg">
        <h3>कृपया माहिती पाहण्यासाठी वरील बटणांवर क्लिक करा.</h3>
    </div>

    <!-- iFrame Sections -->
    <div id="page1" class="iframe-container">
        <iframe src="1.html"></iframe> <!-- मूळ index.html ला 1.html नाव देऊन येथे लोड करा -->
    </div>

    <div id="page2" class="iframe-container">
        <iframe src="2.html"></iframe>
    </div>

    <div id="page3" class="iframe-container">
        <iframe src="3.html"></iframe>
    </div>

    <div id="page4" class="iframe-container">
        <iframe src="4.html"></iframe>
    </div>

    <div id="page5" class="iframe-container">
        <iframe src="5.html"></iframe>
    </div>

    <script>
        function showPage(pageId, btn) {
            // सर्व इफेम्स लपवा
            var iframes = document.getElementsByClassName('iframe-container');
            for (var i = 0; i < iframes.length; i++) {
                iframes[i].style.display = 'none';
            }

            // स्वागत मेसेज लपवा
            document.getElementById('welcome-msg').style.display = 'none';

            // सर्व बटणांवरील 'active' क्लास काढा
            var buttons = document.getElementsByTagName('button');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }

            // निवडलेला इफेम दाखवा आणि बटण हायलाईट करा
            document.getElementById(pageId).style.display = 'block';
            btn.classList.add('active');
        }
    </script>

</body>
</html>
