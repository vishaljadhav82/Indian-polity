<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PSI Online Exam</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: 'Segoe UI', sans-serif; background:#fdf6e3; margin:0; text-align:center; }
.container { max-width:900px; margin:20px auto; background:#fff; padding:20px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.2); }
h1 { color:#2c3e50; margin-bottom:15px; font-size:28px; }
#instruction { font-size:16px; margin-bottom:15px; color:#555; text-align:left; line-height:1.4; }
.question { font-size:20px; margin-bottom:10px; text-align:left; }
.options { text-align:left; display:flex; flex-wrap:wrap; justify-content:flex-start; gap:10px; }
.options button { padding:12px; font-size:16px; border:none; border-radius:8px; cursor:pointer; transition:0.2s; text-align:left; flex:1 1 calc(45% - 10px); min-width:140px; }
.options button:hover { transform:scale(1.02); background:#e6f0ff; }
.selected { border:3px solid #2c3e50; background:#d0ebff; }
.nav-btn { padding:12px 25px; font-size:18px; border:none; border-radius:10px; background:#2c3e50; color:white; cursor:pointer; margin-top:20px; }
.match-item, .seq-item { padding:10px; margin:5px; border-radius:8px; background:#f7f3ea; cursor:pointer; display:inline-block; min-width:120px; }
.correct { background:green; color:white; }
.wrong { background:red; color:white; }
.review-correct { border-left:4px solid green; background:#e6ffe6; padding:12px; margin:12px 0; border-radius:8px; }
.review-wrong { border-left:4px solid red; background:#ffe6e6; padding:12px; margin:12px 0; border-radius:8px; }
.scoreBox { font-size:20px; margin-top:20px; text-align:left; line-height:1.5; }
@media (max-width:600px){
    h1 { font-size:22px; }
    .question { font-size:18px; }
    .options button { flex:1 1 100%; font-size:16px; }
    #instruction { font-size:14px; }
    .match-item, .seq-item { min-width:100px; font-size:14px; padding:8px; }
}
</style>
</head>
<body>

<div class="container">
<h1>🧠 PSI Online Exam</h1>
<div id="quizPage">
    <div id="instruction"></div>
    <div class="question" id="q"></div>
    <div class="options" id="options"></div>
    <button class="nav-btn" id="nextBtn" onclick="nextQ()">Next ➜</button>
</div>
<div id="resultPage" class="scoreBox" style="display:none;"></div>
</div>

<script>
let questions = [
  { type:"mcq", q:"वास्को-द-गामा भारतात कोणत्या वर्षी आणि कुठे आला?", options:["१४९८, कोझिकोड","१४९२, गोवा","१५०२, मद्रास","१४९८, मुंबई"], answer:0 },
  { type:"mcq", q:"डच ईस्ट इंडिया कंपनीची स्थापना आणि मुख्य व्यापार कोणता होता?", options:["१६०२, मसाले","१६००, कापड","१६०२, रेशीम","१६०५, मसाले"], answer:0 },
  { type:"mcq", q:"सर थॉमस रो भारतात कोणत्या वर्षी आला?", options:["१६१५","१६०८","१६२०","१६१०"], answer:0 },
  { type:"match", q:"युरोपीय राष्ट्र व भारतातील आगमनाची जोडी करा:", A:["पोर्तुगीज","डच","इंग्रज","फ्रेंच"], B:["१६००","१४९८","१६०२","१७२०s"], answer:[1,2,0,3] },
  { type:"sequence", q:"इंग्रजांचे प्रमुख वखारी योग्य क्रम लावा:", items:["सुरत","मुंबई","मद्रास","कलकत्ता"], answer:[0,1,2,3] },
  { type:"assertion-reason", q:"Assertion (A): प्लासी लढाईत इंग्रजांचा विजय मीर जाफरमुळे झाला. Reason (R): इंग्रजांची सेना खूप मोठी होती.", options:["A & R correct, R explains A","A correct, R wrong","A wrong, R correct","Both wrong"], answer:1 },
  { type:"case-study", q:"कर्नाटक युद्धांदरम्यान इंग्रज व फ्रेंच साम्राज्य यांचा संघर्ष झाला. त्यानंतर इंग्रजांचे वर्चस्व वाढले. इंग्रजांचे वर्चस्व कसे बदलले?", options:["वाढले","कमी झाले","फ्रेंचांचा प्रभाव वाढला","पोर्तुगीजांचा प्रभाव वाढला"], answer:0 }
];

let index=0, answers=[];

function loadQuestion(){
    let q = questions[index];
    document.getElementById("q").innerText = q.q;
    let instr = "";
    if(q.type==="mcq" || q.type==="assertion-reason") instr = "✅ योग्य उत्तरावर क्लिक करा.";
    else if(q.type==="match") instr = "🔗 A आणि B मधील योग्य जोडी क्लिक करा.";
    else if(q.type==="sequence") instr = "🔢 घटक योग्य क्रमाने क्लिक करा.";
    else if(q.type==="case-study") instr = "📖 वाचून योग्य उत्तर निवडा.";
    document.getElementById("instruction").innerText = instr;

    let opts = document.getElementById("options");
    opts.innerHTML="";

    if(q.type==="mcq" || q.type==="assertion-reason" || q.type==="case-study"){
        q.options.forEach((o,i)=>{
            let btn = document.createElement("button");
            btn.innerText = o;
            btn.onclick = ()=>{ answers[index]=i; highlightSelection(); };
            opts.appendChild(btn);
        });
    }
    else if(q.type==="match"){
        let selectedA=null;
        q.A.forEach((a,i)=>{
            let btn = document.createElement("button");
            btn.innerText = a;
            btn.classList.add("match-item");
            btn.onclick = ()=>{ selectedA=i; highlightMatch(); };
            opts.appendChild(btn);
        });
        opts.appendChild(document.createElement("br"));
        q.B.forEach((b,i)=>{
            let btn = document.createElement("button");
            btn.innerText = b;
            btn.classList.add("match-item");
            btn.onclick = ()=>{
                if(selectedA!=null){
                    answers[index]=answers[index]||[];
                    answers[index][selectedA]=i;
                    selectedA=null;
                    highlightMatch();
                }
            };
            opts.appendChild(btn);
        });
        highlightMatch();
    }
    else if(q.type==="sequence"){
        let userSeq = answers[index]||[];
        q.items.forEach((item,i)=>{
            let btn = document.createElement("button");
            btn.innerText = item;
            btn.classList.add("seq-item");
            if(userSeq.includes(i)) btn.classList.add("selected");
            btn.onclick = ()=>{
                if(!userSeq.includes(i)) userSeq.push(i);
                else userSeq = userSeq.filter(x=>x!==i);
                answers[index]=userSeq;
                highlightSequence();
            };
            opts.appendChild(btn);
        });
    }
}

function highlightSelection(){
    let buttons = document.querySelectorAll(".options button");
    buttons.forEach((b,i)=> b.classList.toggle("selected", answers[index]===i));
}

function highlightMatch(){
    let q=questions[index];
    let ans=answers[index]||[];
    let items=document.querySelectorAll(".match-item");
    items.forEach(b=>b.classList.remove("selected"));
    ans.forEach((v,i)=>{
        if(v!=null){
            items[i].classList.add("selected");
            items[q.A.length+v].classList.add("selected");
        }
    });
}

function highlightSequence(){
    let q=questions[index];
    let ans=answers[index]||[];
    let buttons = document.querySelectorAll(".seq-item");
    buttons.forEach((b,i)=> b.classList.toggle("selected", ans.includes(i)));
}

function nextQ(){
    index++;
    if(index<questions.length) loadQuestion();
    else showResult();
}

function showResult(){
    document.getElementById("quizPage").style.display="none";
    document.getElementById("resultPage").style.display="block";
    let score=0;
    let html = `<h2>🎯 तुमचा स्कोअर:</h2>`;
    questions.forEach((q,i)=>{
        let ans=answers[i];
        let correct=false;
        if(q.type==="mcq" || q.type==="assertion-reason" || q.type==="case-study") correct = ans===q.answer;
        else if(q.type==="match" || q.type==="sequence") correct = JSON.stringify(ans)===JSON.stringify(q.answer);
        if(correct) score++;
        html += `<div class="${correct?'review-correct':'review-wrong'}">
                    <div class="question"><b>Q${i+1}:</b> ${q.q}</div>`;
        if(q.type==="mcq" || q.type==="assertion-reason" || q.type==="case-study"){
            html += `<div>तुमचे उत्तर: ${ans!=null?q.options[ans]:"न दिलेले"}</div>
                     <div>योग्य उत्तर: ${q.options[q.answer]}</div>`;
        } else if(q.type==="match"){
            html += `<div>तुमचे उत्तर:<br>`;
            q.A.forEach((a,j)=>{
                html += `${a} → ${ans && ans[j]!=null?q.B[ans[j]]:"न दिलेले"}<br>`;
            });
            html += `</div><div>योग्य उत्तर:<br>`;
            q.A.forEach((a,j)=>{
                html += `${a} → ${q.B[q.answer[j]]}<br>`;
            });
            html += `</div>`;
        } else if(q.type==="sequence"){
            html += `<div>तुमची क्रमवारी:<br>`;
            (ans||[]).forEach(n=> html += `${q.items[n]} → `);
            html += `</div><div>योग्य क्रमवारी:<br>`;
            q.answer.forEach(n=> html += `${q.items[n]} → `);
            html += `</div>`;
        }
        html += `</div>`;
    });
    html = `<h2>🎯 तुमचा स्कोअर: ${score} / ${questions.length}</h2>` + html;
    document.getElementById("resultPage").innerHTML = html;
}

loadQuestion();
</script>
</body>
</html>
