<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

body{
    font-family:'Patrick Hand', cursive;
    background:#e9e4d8;
    margin:0;
}

.container{
    width:90%;
    margin:auto;
    background: repeating-linear-gradient(white, white 28px, #f0f0f0 29px);
    padding:20px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    min-height:90vh;
}

h1{
    text-align:center;
    border-bottom:2px dashed #666;
    padding:10px;
}

/* typing effect */
.question{
    font-size:22px;
    margin-bottom:15px;
    white-space:pre-line;
    animation: fadeIn 0.5s ease-in;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

/* options */
.options button{
    display:block;
    width:100%;
    margin:8px 0;
    padding:12px;
    border:none;
    background:#f7f3ea;
    cursor:pointer;
    border-radius:8px;
    font-size:18px;
    transition:0.2s;
}

.options button:hover{
    transform:scale(1.02);
    background:#e6f0ff;
}

.correct{background:#b7f7c1;}
.wrong{background:#f7b7b7;}

/* buttons */
.next-btn{
    background:#2c3e50;
    color:white;
    padding:10px;
    border:none;
    margin-top:10px;
    cursor:pointer;
    border-radius:8px;
}

/* bookmark */
.bookmark{
    float:right;
    cursor:pointer;
    font-size:22px;
}

/* pages */
.page{display:none;}
.active{display:block;}

/* score */
.scoreBox{
    text-align:center;
    font-size:22px;
}
</style>
</head>

    "options": [
      "दोन्ही बरोबर आणि R योग्य स्पष्टीकरण",
      "A बरोबर, R चुकीचा",

    ],
    "answer": 0,

  }

  // 👉 100 complete structure
]

let index=0;
let score=0;
let wrong=[];
let bookmarks={};
let answered=false;

/* LOAD QUESTION */
function loadQuestion(){

    answered=false;

    let q=questions[index];

    document.getElementById("q").innerText=
    `Q${q.id}\n\n${q.question}`;

    let opt=document.getElementById("options");
    opt.innerHTML="";

    q.options.forEach((o,i)=>{

        let btn=document.createElement("button");
        btn.innerText=o;

        btn.onclick=()=>{

            if(answered) return;

            answered=true;

            if(i===q.answer){
                btn.classList.add("correct");
                score++;
            }else{
                btn.classList.add("wrong");
                wrong.push(q);
            }
        };

        opt.appendChild(btn);
    });
}

/* NEXT QUESTION */
function nextQ(){

    index++;

    if(index<questions.length){
        loadQuestion();
    }else{
        showScore();
    }
}

/* BOOKMARK */
function toggleBookmark(){
    bookmarks[index]=!bookmarks[index];
    alert(bookmarks[index]?"Bookmarked ✔":"Removed ❌");
}

/* SCORE PAGE */
function showScore(){

    document.getElementById("quizPage").classList.remove("active");
    document.getElementById("scorePage").classList.add("active");

    document.getElementById("scorePage").innerHTML=`
        🎯 <h2>Test Complete</h2>
        <p>Score: ${score} / ${questions.length}</p>

        <h3>❌ Wrong Answers</h3>
        ${wrong.map(q=>`<p>• ${q.question}</p>`).join("")}

        <h3>🔖 Bookmarked</h3>
        ${questions.map((q,i)=>bookmarks[i]?`<p>• ${q.question}</p>`:"").join("")}
    `;
}

/* START */
loadQuestion();

</script>
