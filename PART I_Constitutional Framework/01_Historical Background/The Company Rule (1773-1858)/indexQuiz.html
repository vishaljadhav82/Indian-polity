@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

body{

/* REAL NOTEBOOK LOOK */
.container{
    width:92%;
    margin:auto;
    background:
      repeating-linear-gradient(
        white,
        white 28px,
        #eaeaea 29px
      );
    padding:20px;
    border-radius:12px;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);
    min-height:90vh;
}

/* TITLE */
h1{
    text-align:center;
    border-bottom:2px dashed #555;
    padding:10px;
    color:#2c3e50;
}

/* QUESTION */
.question{
    font-size:22px;
    white-space:pre-line;
    margin-bottom:15px;
    animation:fade 0.4s ease-in;
}

@keyframes fade{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

/* OPTIONS */
.options button{
    width:100%;
    margin:8px 0;
    padding:12px;
    border:none;
    background:#f7f3ea;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:0.2s;
    text-align:left;
}

.options button:hover{
    transform:scale(1.02);
    background:#e6f0ff;
}

/* ANSWER COLORS */
.correct{background:#b7f7c1 !important;}
.wrong{background:#f7b7b7 !important;}
.selected{border-left:5px solid #2c3e50;}

/* BUTTON */
.next-btn{
    background:#2c3e50;
    color:white;
    padding:10px;
    border:none;
    margin-top:10px;
    cursor:pointer;
    border-radius:8px;
}

/* BOOKMARK */
.bookmark{
    float:right;
    font-size:22px;
    cursor:pointer;
}

/* PAGES */
.page{display:none;}
.active{display:block;}

/* SCORE */
.scoreBox{
    font-size:20px;
}

/* REVIEW CARD */
.review{
    background:rgba(255,255,255,0.6);
    padding:12px;
    margin:10px 0;
    border-left:4px solid #2c3e50;
    border-radius:8px;
}
</style>
</head>

/* ================= STATE ================= */
let index=0;
let score=0;

let answers=[];   // store user selection
let bookmarks={};

let selectedIndex=null;

/* ================= LOAD ================= */
function loadQuestion(){

    selectedIndex=null;

    let q=questions[index];

    document.getElementById("q").innerText=
    `Q${q.id}\n\n${q.question}`;

    let opt=document.getElementById("options");
    opt.innerHTML="";

    q.options.forEach((o,i)=>{

        let btn=document.createElement("button");
        btn.innerText=o;

        btn.onclick=()=>{

            selectedIndex=i;

            // mark selection
            document.querySelectorAll(".options button").forEach(b=>{
                b.classList.remove("selected");
            });

            btn.classList.add("selected");

        };

        opt.appendChild(btn);
    });
}

/* ================= NEXT ================= */
function nextQ(){

    let q=questions[index];

    answers.push({
        question:q.question,
        selected:selectedIndex,
        correct:q.answer,
        options:q.options
    });

    if(selectedIndex===q.answer){
        score++;
    }

    index++;

    if(index<questions.length){
        loadQuestion();
    }else{
        showResult();
    }
}

/* ================= BOOKMARK ================= */
function toggleBookmark(){
    bookmarks[index]=!bookmarks[index];
    alert(bookmarks[index]?"Bookmarked ✔":"Removed ❌");
}

/* ================= RESULT + REVIEW ================= */
function showResult(){

    document.getElementById("quizPage").classList.remove("active");
    document.getElementById("resultPage").classList.add("active");

    let html=`
        🎯 <h2>PSI Test Completed</h2>
        <p><b>Score:</b> ${score} / ${questions.length}</p>

        <h3>📘 Full Review Notebook</h3>
    `;

    answers.forEach((a,i)=>{

        html+=`
        <div class="review">

        <b>Q${i+1}:</b> ${a.question}<br><br>

        ${a.options.map((o,idx)=>{

            let style="";

            if(idx===a.correct) style="color:green;font-weight:bold;";
            if(idx===a.selected && idx!==a.correct) style="color:red;font-weight:bold;";

            return `<div style="${style}">• ${o}</div>`;
        }).join("")}

        </div>
        `;
    });

    document.getElementById("resultPage").innerHTML=html;
}

/* ================= START ================= */
loadQuestion();
