<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ऐतिहासिक पार्श्वभूमी - क्राऊन रुल</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            /* खालच्या नेव्हिगेशन आणि लेबलसाठी पुरेशी जागा */
            padding-bottom: 100px; 
        }

        /* १. पारदर्शक आणि कमी जागेचा हेडर */
        header {
            background: rgba(44, 62, 80, 0.85); /* ८५% पारदर्शकता */
            backdrop-filter: blur(8px); /* काचेसारखा ब्लर इफेक्ट */
            color: white;
            padding: 10px 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        header p {
            margin: 0;
            font-size: 1rem;
            font-weight: bold;
        }
        header span {
            font-size: 0.75rem;
            opacity: 0.9;
            display: block;
            margin-top: 2px;
        }

        /* २. मुख्य कंटेनर आणि आयफ्रेम */
        .main-container {
            width: 100%;
        }
        iframe {
            width: 100%;
            /* हेडरची उंची वजा करून उरलेली पूर्ण स्क्रीन */
            height: calc(100vh - 60px); 
            border: none;
            display: none;
        }
        iframe.active {
            display: block;
        }

        /* ३. विभाग दर्शवणारे लेबल (Fixed वर) */
        .section-label {
            background: #f8f9fa;
            padding: 5px 15px;
            font-size: 11px;
            font-weight: bold;
            color: #2c3e50;
            position: fixed;
            bottom: 50px; /* नेव्हिगेशन बारच्या बरोबर वर */
            width: 100%;
            z-index: 999;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #eee;
            box-sizing: border-box;
        }

        /* ४. मोबाईल नेव्हिगेशन - स्क्रोलिंगसह */
        .mobile-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            overflow-x: auto; /* आडव्या स्क्रोलिंगसाठी */
            white-space: nowrap; /* मजकूर एका ओळीत ठेवण्यासाठी */
            box-shadow: 0 -3px 15px rgba(0,0,0,0.1);
            z-index: 1000;
            /* स्मूथ स्क्रोलिंगसाठी */
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: none; /* Firefox साठी स्क्रोलबार लपवा */
        }
        
        /* Chrome/Safari साठी स्क्रोलबार लपवा */
        .mobile-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-item {
            padding: 15px 20px;
            text-decoration: none;
            color: #7f8c8d;
            font-size: 12px;
            font-weight: bold;
            border: none;
            background: none;
            /* महत्त्वाचे: बटणे दबली जाऊ नयेत म्हणून */
            flex: 0 0 auto; 
            border-top: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: var(--accent);
            border-top: 3px solid var(--accent);
            background: #fff9f4;
        }

        #welcome {
            padding: 50px 20px;
            text-align: center;
            color: #95a5a6;
        }
    </style>
</head>
<body onload="openTabByDefault()">

<header>
    <p>ऐतिहासिक पार्श्वभूमी</p>
    <span>👑 क्राऊन रुल (१८५८-१९४७)</span>
</header>

<div class="main-container">
    <div id="welcome">
        <h2>प्रकरण निवडा</h2>
        <p>खालील पर्यायांवरून अभ्यासाला सुरुवात करा.</p>
    </div>

    <!-- मजकूर लोड करण्यासाठी आयफ्रेम्स -->
    <iframe id="p1" src="1.html"></iframe>
    <iframe id="p2" src="2.html"></iframe>
    <iframe id="p3" src="3.html"></iframe>
    <iframe id="p4" src="4.html"></iframe>
    <iframe id="p5" src="5.html"></iframe>
    <iframe id="p6" src="6.html"></iframe>
</div>

<div class="section-label">📍 CROWN RULE (राजसत्ता)</div>

<nav class="mobile-nav">
    <button class="nav-item" onclick="changeTab(event, 'p1')">१८५८ कायदा</button>
    <button class="nav-item" onclick="changeTab(event, 'p2')">१८६१/१९०९</button>
    <button class="nav-item" onclick="changeTab(event, 'p3')">१९१९ कायदा</button>
    <button class="nav-item" onclick="changeTab(event, 'p4')">१९३५ कायदा</button>
    <button class="nav-item" onclick="changeTab(event, 'p5')">१९४७ कायदा</button>
    <button class="nav-item" onclick="changeTab(event, 'p6')">पहिले मंत्रिमंडळ</button>
</nav>

<script>
    // १. पेज लोड झाल्यावर पहिला टॅब उघडणे
    function openTabByDefault() {
        const firstTab = document.querySelector('.nav-item');
        if(firstTab) {
            // स्वागत संदेश लपवण्यासाठी इव्हेंट पास न करता मॅन्युअली कॉल
            changeTab({ currentTarget: firstTab }, 'p1');
        }
    }

    // २. टॅब बदलण्याचे फंक्शन
    function changeTab(evt, tabId) {
        // स्वागत संदेश लपवा
        const welcome = document.getElementById('welcome');
        if(welcome) welcome.style.display = 'none';

        // सर्व इफेम्स लपवा
        const iframes = document.querySelectorAll('iframe');
        iframes.forEach(iframe => iframe.classList.remove('active'));

        // सर्व बटणांवरील ॲक्टिव्ह क्लास काढा
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => item.classList.remove('active'));

        // निवडलेला इफेम आणि बटण ॲक्टिव्ह करा
        const targetIframe = document.getElementById(tabId);
        if(targetIframe) {
            targetIframe.classList.add('active');
            evt.currentTarget.classList.add('active');
            
            // क्लिक केल्यावर तो टॅब स्क्रीनच्या मध्यभागी आणण्यासाठी (Auto Scroll)
            evt.currentTarget.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }

        // पेजच्या टॉपला जा
        window.scrollTo(0, 0);
    }
</script>

</body>
</html>
